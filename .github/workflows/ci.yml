name: CI

on:
  push:
  pull_request:

jobs:
  secret-scan:
    name: Secret scan (full history)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # scan every commit, not just the last one
      # gitleaks CLI instead of gitleaks-action: the action requires a paid/registered
      # license key for repositories owned by an organization; the CLI does not.
      - name: Run gitleaks on every commit
        env:
          GITLEAKS_VERSION: "8.18.4"
        run: |
          curl -sSfL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" \
            | tar -xz gitleaks
          ./gitleaks detect --source . --redact --verbose

  build:
    name: colcon build + agent import check (ROS 2 Humble)
    runs-on: ubuntu-22.04
    container: ros:humble
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4

      - name: Install ROS dependencies
        run: |
          apt-get update
          rosdep update --rosdistro humble
          rosdep install --from-paths tutorial_ws/src --ignore-src -y --rosdistro humble

      - name: Build tutorial_nodi_base
        run: |
          source /opt/ros/humble/setup.bash
          cd tutorial_ws
          colcon build --event-handlers console_direct+
          source install/setup.bash
          ros2 pkg executables tutorial_nodi_base

      - name: Import the voice agent with the locked dependencies (no API key needed)
        run: |
          apt-get install -y python3-venv
          source /opt/ros/humble/setup.bash
          python3 -m venv --system-site-packages /tmp/venv
          source /tmp/venv/bin/activate
          # Ubuntu 22.04 ships setuptools 59 / packaging 21.3, too old to build the
          # source-only ROSA dependencies (PyInputPlus, PySimpleValidate, stdiomask).
          # setuptools<80: newer versions build these packages too, but make pip warn
          # about a conflict with ROS 2 colcon (which never uses this venv).
          python3 -m pip install --upgrade pip wheel packaging "setuptools<80"
          python3 -m pip install -r voice_agent/requirements.lock
          cd voice_agent
          python3 -c "import agente_comune as a; print([t.name for t in a.STRUMENTI])"
          python3 -m py_compile 09_agente_vocale.py 09_agente_vocale_testo.py
